[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kove-engine"
version = "0.1.0"
description = "Local video analysis engine for K.O.V.E."
# Upper bound is real, not cosmetic: mediapipe dropped the `mp.solutions` API
# used by the face analyzer in 1.0, and the last release that still has it
# (0.10.21) only ships wheels for CPython 3.9-3.12. On 3.13+ pip would happily
# install mediapipe 1.1.0 and the analyzer would fail at import.
requires-python = ">=3.11,<3.13"
dependencies = [
    # Exact pins, resolved on CPython 3.11 and verified by running the test
    # suite (see README). Move them deliberately, not implicitly.
    #
    # The chain worth knowing about: mediapipe==0.10.21 requires numpy<2, which
    # caps opencv-contrib-python at 4.11.0.86 because later OpenCV releases
    # require numpy>=2. Do not add a second OpenCV distribution here — cv2
    # would then be provided by two packages at once.
    "numpy==1.26.4",
    "mediapipe==0.10.21",
    "opencv-contrib-python==4.11.0.86",
    "scipy==1.17.1",
    "librosa==0.11.0",
    # The maintained fork of webrtcvad. The original is sdist-only and imports
    # pkg_resources, which is absent from a clean venv, so `import webrtcvad`
    # fails there. This fork ships prebuilt wheels for cp310-cp314 and drops
    # that dependency; the import name is unchanged.
    "webrtcvad-wheels==2.0.14.post1",
    "scikit-learn==1.9.1",
    "pydantic==2.14.1",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "aiosqlite==0.22.1",
]

[project.optional-dependencies]
dev = [
    # Required by the suite and previously undeclared: the job-store tests use
    # the asyncio plugin, and fastapi.testclient now wants httpx2 (starlette
    # emits a DeprecationWarning when only the older `httpx` is installed).
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx2==2.13.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
]

[project.scripts]
kove-engine = "kove_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kove_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires ffmpeg and a real video file (KOVE_TEST_VIDEO env var)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
