services:
  transcribe:
    build: .
    ports:
      # Published on every host interface. The API requires a bearer token
      # (KOVE_TRANSCRIBE_TOKEN); restrict the cloud security group to the clients
      # that need it as well, rather than relying on the token alone.
      - "8000:8000"
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cuda}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-float16}
      # Required. Compose refuses to start without it, because the service fails
      # closed: no token means 503 rather than an open GPU endpoint.
      - KOVE_TRANSCRIBE_TOKEN=${KOVE_TRANSCRIBE_TOKEN:?set KOVE_TRANSCRIBE_TOKEN (openssl rand -hex 32) in the environment or a .env file next to this compose file}
      - KOVE_TRANSCRIBE_MAX_UPLOAD_BYTES=${KOVE_TRANSCRIBE_MAX_UPLOAD_BYTES:-209715200}
      - KOVE_TRANSCRIBE_MAX_CONCURRENT_JOBS=${KOVE_TRANSCRIBE_MAX_CONCURRENT_JOBS:-2}
      - KOVE_TRANSCRIBE_ALLOWED_ORIGINS=${KOVE_TRANSCRIBE_ALLOWED_ORIGINS:-}
