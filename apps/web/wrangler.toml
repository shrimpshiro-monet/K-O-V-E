name = "kove-advanced"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# Cloudflare Pages configuration for Kove Advanced video editor
# This app requires special headers for SharedArrayBuffer (used by FFmpeg.wasm)
# Custom domains:
# - app.kove-advanced.video opens the standard video editor flow
# - motion.kove-advanced.video opens the Motion Creator surface by hostname detection

[env.production]
name = "kove-advanced"

[env.preview]
name = "kove-advanced-preview"
