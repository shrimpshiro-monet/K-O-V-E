packages:
  - "apps/*"
  - "packages/*"
patchedDependencies:
  "@ffmpeg/core-mt@0.12.6": "patches/@ffmpeg__core-mt@0.12.6.patch"
  "@ffmpeg/core@0.12.6": "patches/@ffmpeg__core@0.12.6.patch"
onlyBuiltDependencies:
  - electron
ignoredBuiltDependencies:
  - core-js
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
  - workerd
allowBuilds:
  core-js: false
  electron: true
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  workerd: false

# Desktop builds stage binaries for each packaged target (macOS builds both arches).
supportedArchitectures:
  os: [darwin, linux, win32]
  cpu: [x64, arm64]
